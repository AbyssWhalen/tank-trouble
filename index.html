<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坦克回廊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #e8e8ec;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-canvas {
      background: #e8e8ec;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="960" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
